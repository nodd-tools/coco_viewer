<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COCO Viewer</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="coco_viewer.js"></script>
</head>
<body class="bg-dark text-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid">
      <div class="d-flex align-items-center">
        <!-- Left Sidebar Toggle -->
        <button class="btn btn-outline-light me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarControls" aria-controls="sidebarControls">
          <i class="bi bi-list"></i> Menu
        </button>
        <span class="navbar-brand mb-0 h1">COCO Annotation Viewer</span>
      </div>
      <!-- Right Sidebar Toggle (Optional, for manual opening) -->
      <button class="btn btn-outline-info" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarDetails" aria-controls="sidebarDetails">
        <i class="bi bi-graph-up"></i> Details
      </button>
    </div>
  </nav>

  <!-- Left Offcanvas Sidebar (Controls) -->
  <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="sidebarControls" aria-labelledby="sidebarControlsLabel">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="offcanvas-title" id="sidebarControlsLabel">Controls</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      
      <!-- Load Section -->
      <div class="mb-4">
        <label for="json-url" class="form-label text-secondary fw-bold text-uppercase small">Data Source</label>
        <div class="input-group mb-2">
          <input type="text" class="form-control bg-dark text-light border-secondary" id="json-url" placeholder="https://..." value="annotations.json">
        </div>

        <label for="hierarchy-url" class="form-label text-secondary fw-bold text-uppercase small">Hierarchy Source (Optional)</label>
        <div class="input-group mb-2">
          <input type="text" class="form-control bg-dark text-light border-secondary" id="hierarchy-url" placeholder="hierarchy.json">
        </div>
        
        <button class="btn btn-primary w-100 mt-2" onclick="main()">Load Data</button>
      </div>

      <!-- Navigation Section -->
      <div class="mb-4">
        <label class="form-label text-secondary fw-bold text-uppercase small">Navigation</label>
        
        <div class="input-group mb-2">
          <button class="btn btn-outline-light" onclick="prevImage()" title="Previous (A)">
            <i class="bi bi-arrow-left"></i>
          </button>
          
          <span class="input-group-text bg-dark text-secondary border-secondary">Step</span>
          <input type="number" id="nav-step-size" class="form-control bg-dark text-light border-secondary text-center" value="1" min="1">
          
          <button class="btn btn-outline-light" onclick="nextImage()" title="Next (D)">
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>

        <div class="text-secondary small mt-2">
          <div class="d-flex justify-content-between"><span>Step 1:</span> <kbd>A</kbd> / <kbd>D</kbd></div>
          <div class="d-flex justify-content-between"><span>Step 10:</span> <kbd>S</kbd> / <kbd>W</kbd></div>
          <div class="d-flex justify-content-between"><span>Step 100:</span> <kbd>Q</kbd> / <kbd>E</kbd></div>
        </div>
      </div>

      <!-- Settings Section -->
      <div class="mb-4">
        <label class="form-label text-secondary fw-bold text-uppercase small">View Settings</label>
        
        <div class="mb-3">
          <label for="annotation-type" class="form-label small">Annotation Format</label>
          <select class="form-select bg-dark text-light border-secondary" id="annotation-type" onchange="updateAnnotationType()">
            <option value="keypoint">Keypoints</option>
            <option value="bbox">Bounding Boxes</option>
          </select>
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" role="switch" id="toggleSwitch" checked onclick="toggleAnnotations()">
          <label class="form-check-label" for="toggleSwitch">Show Annotations</label>
        </div>

        <!-- Toggle Labels Switch -->
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" role="switch" id="toggleLabelsSwitch" onclick="toggleLabels()">
          <label class="form-check-label" for="toggleLabelsSwitch">Show Labels & Scores</label>
        </div>

        <!-- Scale Image Toggle -->
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" role="switch" id="scaleSwitch" checked onclick="toggleImageScale()">
          <label class="form-check-label" for="scaleSwitch">Scale Image to Fit</label>
        </div>

        <!-- Hierarchy Expansion Mode -->
        <div class="mb-3">
          <label for="hierarchy-expand" class="form-label small">Hierarchy Expansion</label>
          <select class="form-select bg-dark text-light border-secondary" id="hierarchy-expand" onchange="updateHierarchyExpandMode()">
            <option value="collapsed">Collapse All</option>
            <option value="expanded">Expand All</option>
            <option value="best" selected>Follow Best Score</option>
          </select>
        </div>
      </div>

      <!-- Legend Section -->
      <div class="mb-4">
        <label class="form-label text-secondary fw-bold text-uppercase small">Legend</label>
        <div id="legend" class="border border-secondary rounded p-2" style="min-height: 50px; background: rgba(255,255,255,0.05);">
          <small class="text-muted fst-italic">Load data to see categories...</small>
        </div>
      </div>

    </div>
  </div>

  <!-- Right Offcanvas Sidebar (Details) -->
  <div class="offcanvas offcanvas-end text-bg-dark" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="sidebarDetails" aria-labelledby="sidebarDetailsLabel">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="offcanvas-title" id="sidebarDetailsLabel">Prediction Details</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div id="details-content">
        <div class="text-center text-secondary mt-5">
          <i class="bi bi-hand-index fs-1"></i>
          <p class="mt-2">Select an annotation on the image to view detailed probability scores.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main View Area -->
  <div class="container-fluid p-3 d-flex flex-column align-items-center overflow-auto" style="height: calc(100vh - 60px);">
    
    <!-- Image Display -->
    <div id="image-container" class="shadow-lg border border-secondary rounded mb-3 bg-black fit-screen">
      <img id="coco-image" />
      <canvas id="annotation-canvas"></canvas>
    </div>

  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
